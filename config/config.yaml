project:
  name: PathSnap
  version: 0.1.0
  random_seed: 42

dataset:
  root: data/raw

  partitions:
    training:
      expected_trips: 80

    student_testing:
      expected_trips: 10

    evaluator_testing:
      expected_trips: 10

  file_extensions:
    gps: ".track"
    nodes: ".nodes"
    arcs: ".arcs"
    route: ".route"

  formats:
    track:
      columns:
        - longitude
        - latitude
        - timestamp

    nodes:
      columns:
        - longitude
        - latitude

    arcs:
      columns:
        - from_node_id
        - to_node_id

    route:
      columns:
        - arc_id

processing:
  distance_unit: meters
  coordinate_system: WGS84

validation:
  require_finite_coordinates: true
  require_ordered_timestamps: false

experiments:
  random_seed: 42
  cv_folds: 5
  group_column: trip_id

logging:
  level: INFO
